[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "second-brain-hygiene"
version = "0.1.0"
description = "Hygiene toolkit for a PostgreSQL-backed second-brain knowledge store"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"
dependencies = ["psycopg2-binary>=2.9"]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.1"]

[project.scripts]
second-brain = "knowledge_hygiene:main"

[tool.setuptools]
py-modules = ["knowledge_hygiene"]
include-package-data = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["F", "E9", "I"]